name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/tracefrugal
      - name: One-command demo smoke test
        run: go run ./cmd/tracefrugal demo --no-serve
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Check public dashboard matches embedded assets
        run: python3 scripts/build-site.py --check
      - name: Check dashboard JavaScript
        run: node scripts/test-dashboard.cjs
      - name: Check native Claude dashboard with Go import
        run: node scripts/test-claude-dashboard.cjs
      - name: Check mixed-source and MCP packing dashboard
        run: node scripts/test-native-dashboard.cjs
      - name: Check bilingual UI and session inspector
        run: node scripts/test-i18n.cjs
      - name: Check local optimizer controls and evidence
        run: node scripts/test-optimizer.cjs
      - name: Check cache economics and comparison signals
        run: node scripts/test-economics.cjs
